# GitHub, 60 gun commit olmayinca scheduled workflow'lari kapatir
# (disabled_inactivity). Bu is, ayda 2 kez bos commit atarak sayaci sifirlar.
name: Repo Keepalive

on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inactivity sayacini sifirla
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "chore: GitHub Actions inactivity sayacini sifirla"
          git push

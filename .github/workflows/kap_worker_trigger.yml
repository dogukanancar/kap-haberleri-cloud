# Yedek tetikleyici. 5 dk cift cron GitHub'da throttle oluyordu;
# ana zamanlama kap_worker.yml (10 dk). Bu dosya yalnizca elle calisir.
name: KAP Worker Zamanlayici

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: kap-worker-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: KAP Worker'i tetikle
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "kap_worker.yml",
              ref: "main",
            });
            core.info("kap_worker.yml tetiklendi.");
